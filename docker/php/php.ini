; ── OPcache — critical for Laravel performance in production ──────────────
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 20000
; Disable timestamp validation — files only change on deploy (image rebuild)
opcache.validate_timestamps    = 0
opcache.revalidate_freq        = 0
opcache.fast_shutdown          = 1
opcache.save_comments          = 1

; ── Memory & execution limits ─────────────────────────────────────────────
memory_limit        = 256M
max_execution_time  = 300
max_input_time      = 300

; ── Upload limits (bulk Excel imports, lease PDFs) ────────────────────────
upload_max_filesize = 50M
post_max_size       = 50M
max_input_vars      = 3000

; ── Error reporting (production — log only, never display) ────────────────
display_errors  = Off
display_startup_errors = Off
log_errors      = On
error_log       = /var/www/html/storage/logs/php-error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Timezone ──────────────────────────────────────────────────────────────
date.timezone = Africa/Johannesburg

; ── Session ───────────────────────────────────────────────────────────────
session.gc_maxlifetime = 7200
