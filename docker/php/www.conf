; PHP-FPM pool configuration for production

[www]
user  = www-data
group = www-data

; Listen on TCP — Nginx reaches PHP-FPM via Docker network
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

; Dynamic process manager — scales workers based on load
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Recycle workers after N requests to prevent memory leaks
pm.max_requests      = 500

; Logging — slow requests (> 10s) are logged for investigation
slowlog              = /var/www/html/storage/logs/php-fpm-slow.log
request_slowlog_timeout = 10s

; Status / ping endpoints (useful for container health checks)
pm.status_path = /fpm-status
ping.path      = /fpm-ping
ping.response  = pong

; Pass all environment variables from the container into PHP
clear_env = no
