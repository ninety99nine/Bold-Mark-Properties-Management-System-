# ── HTTP → HTTPS redirect ─────────────────────────────────
server {
    listen 80;
    server_name portal.boldmarkprop.co.za;

    # Certbot HTTP-01 challenge (must work over HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name portal.boldmarkprop.co.za;

    ssl_certificate     /etc/letsencrypt/live/portal.boldmarkprop.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.boldmarkprop.co.za/privkey.pem;
    include /etc/nginx/ssl_params.conf;

    # Vue SPA static files are baked into this image
    root  /var/www/html/public-web;
    index index.html;

    # Allow large uploads (bulk Excel imports, lease PDFs)
    client_max_body_size 50M;

    # ── Laravel API — FastCGI to PHP-FPM ──────────────────
    # Handles: /api/*, /up (health check), and Resend webhooks
    location ~ ^/(api|up|webhooks)(/|$) {
        fastcgi_pass   app_backend;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_param  SERVER_NAME     $host;
        fastcgi_param  HTTPS           on;

        fastcgi_read_timeout   300;
        fastcgi_connect_timeout 60;
        fastcgi_buffers        16 16k;
        fastcgi_buffer_size    32k;
    }

    # ── Laravel Horizon dashboard ──────────────────────────
    location /horizon {
        fastcgi_pass   app_backend;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param  HTTPS           on;
    }

    # ── Vue SPA static assets — long-lived cache ──────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Vue Router SPA fallback ───────────────────────────
    # All non-asset, non-API routes go to index.html so
    # Vue Router handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
