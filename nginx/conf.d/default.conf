# ── HTTP: ACME challenge + redirect to HTTPS ───────────────
server {
    listen 80;
    server_name portal.boldmarkprop.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main application ─────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name portal.boldmarkprop.co.za;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    include /etc/nginx/ssl_params.conf;

    root  /var/www/html/public-web;
    index index.html;

    client_max_body_size 50M;

    # ── Laravel API — FastCGI to PHP-FPM ──────────────────
    location ~ ^/(api|up|webhooks)(/|$) {
        fastcgi_pass   app_backend;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_param  SERVER_NAME     $host;
        fastcgi_param  HTTPS           on;

        fastcgi_read_timeout    300;
        fastcgi_connect_timeout  60;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    # ── Laravel Horizon dashboard ──────────────────────────
    location /horizon {
        fastcgi_pass   app_backend;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param  HTTPS           on;
    }

    # ── index.html — never cache so deploys always take effect ──
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # ── Vue SPA static assets — cache forever (content-hashed) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Vue Router SPA fallback ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
